<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
		<title>Prompt library for creators and builders: AI video prompts, image prompts and Claude Code skills | cizle</title>
		<meta name="description" content="cizle is a free library of AI video prompts, image prompts and Claude Code skills, each saved with the video it made and the person who wrote it. Copy one, change a line." />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Text:wght@400;500;600&display=swap" rel="stylesheet" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
		<script>
			try {
				const t = localStorage.getItem("cizle-theme") || "system";
				const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.classList.add("js");
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
